name: SHRI-VERSE Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SHRI-VERSE APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Android SDK directory:"
            ls -la "$ANDROID_HOME"
            echo "cmdline-tools:"
            ls -la "$ANDROID_HOME/cmdline-tools" || true
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          set -e

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Configure Godot Android paths
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/shutdown_adb_on_exit = true
          EOF

          echo "===== GODOT EDITOR SETTINGS ====="
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Download Godot 4.5.2
        run: |
          set -e

          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip

          unzip -q godot.zip

          mv Godot_v4.5.2-stable_linux.x86_64 godot

          chmod +x godot

      - name: Install Godot Android export templates
        run: |
          set -e

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.5.2.stable"

          curl -L --fail --retry 3 \
            -o templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz

          mkdir -p templates_extract

          unzip -q templates.tpz \
            -d templates_extract

          cp -R \
            templates_extract/templates/. \
            "$HOME/.local/share/godot/export_templates/4.5.2.stable/"

      - name: Verify Godot
        run: |
          set -e

          ./godot --version

      - name: Validate project
        run: |
          set -e

          ./godot \
            --headless \
            --path . \
            --editor \
            --quit

      - name: Export Android APK - Diagnostic
        run: |
          set -eux

          echo "========================================"
          echo "GODOT VERSION"
          echo "========================================"

          ./godot --version

          echo "========================================"
          echo "ANDROID ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          echo "========================================"
          echo "ANDROID SDK CHECK"
          echo "========================================"

          test -f "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.1"

          echo "ADB:"
          ls -la "$ANDROID_HOME/platform-tools/adb"

          echo "BUILD TOOLS:"
          ls -la "$ANDROID_HOME/build-tools/35.0.1"

          echo "ANDROID PLATFORM:"
          ls -la "$ANDROID_HOME/platforms/android-35"

          echo "========================================"
          echo "GODOT EDITOR SETTINGS"
          echo "========================================"

          cat "$HOME/.config/godot/editor_settings-4.tres"

          echo "========================================"
          echo "EXPORT PRESET"
          echo "========================================"

          cat export_presets.cfg

          echo "========================================"
          echo "PROJECT VALIDATION - VERBOSE"
          echo "========================================"

          ./godot \
            --headless \
            --verbose \
            --path . \
            --editor \
            --quit

          echo "========================================"
          echo "ANDROID EXPORT - VERBOSE"
          echo "========================================"

          mkdir -p build

          ./godot \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android" \
            build/SHRI-VERSE.apk

      - name: Verify APK
        run: |
          set -e

          test -f build/SHRI-VERSE.apk

          ls -lh build/SHRI-VERSE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHRI-VERSE-APK
          path: build/SHRI-VERSE.apk
          if-no-files-found: error
