name: SHRI-VERSE Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SHRI-VERSE
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.5.2
        run: |
          wget -q --show-progress \
            https://downloads.tuxfamily.org/godotengine/4.5.2/Godot_v4.5.2-stable_linux.x86_64.zip

          unzip -q Godot_v4.5.2-stable_linux.x86_64.zip

          mv Godot_v4.5.2-stable_linux.x86_64 godot

          chmod +x godot

      - name: Verify Godot
        run: |
          ./godot --version

      - name: Validate project
        run: |
          ./godot --headless --path . --editor --quit
